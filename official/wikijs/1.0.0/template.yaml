apiVersion: miabi.io/v1
kind: Template
metadata:
  name: wikijs
  displayName: Wiki.js
  version: 1.0.0
  description: Modern wiki with a Markdown and visual editor, page history and fine-grained permissions.
  category: Productivity
  icon: https://cdn.simpleicons.org/wikidotjs
  homepage: https://js.wiki
  tags: [wiki, documentation, markdown, knowledge-base]
databases:
  - name: db
    engine: postgres
    version: "17-alpine"
    placement: auto
volumes:
  - name: content
applications:
  - name: wikijs
    primary: true
    image: ghcr.io/requarks/wiki
    tag: "2.5.314"
    ports:
      - container: 3000
        scheme: http
    env:
      DB_TYPE: postgres
      DB_HOST: "{{ .databases.db.host }}"
      DB_PORT: "{{ .databases.db.port }}"
      DB_NAME: "{{ .databases.db.name }}"
      DB_USER: "{{ .databases.db.user }}"
      DB_PASS: "{{ .databases.db.password }}"
    secretEnv:
      - DB_PASS
    # Holds page content when a local/git storage target is enabled; the wiki
    # itself lives in PostgreSQL.
    mounts:
      - volume: content
        path: /wiki/data/content
    healthcheck:
      type: http
      path: /healthz
      port: 3000
      intervalSeconds: 30
      timeoutSeconds: 5
      retries: 5
      startPeriodSeconds: 45
