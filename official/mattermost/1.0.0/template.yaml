apiVersion: miabi.io/v1
kind: Template
metadata:
  name: mattermost
  displayName: Mattermost
  version: 1.0.0
  description: Self-hosted team chat with channels, threads, file sharing and integrations.
  category: Productivity
  icon: https://cdn.simpleicons.org/mattermost
  homepage: https://mattermost.com
  tags: [chat, collaboration, team, messaging]
inputs:
  - key: site_url
    label: Public URL
    help: The public base URL Mattermost is served on. Clients, invitations and integrations all use it.
    type: string
    required: true
    pattern: "^https?://"
    placeholder: https://chat.example.com
databases:
  - name: db
    engine: postgres
    version: "17-alpine"
    placement: auto
volumes:
  - name: config
  - name: data
  - name: logs
  - name: plugins
  - name: client-plugins
applications:
  - name: mattermost
    primary: true
    image: mattermost/mattermost-team-edition
    tag: "11.10.0"
    ports:
      - container: 8065
        scheme: http
    env:
      MM_SERVICESETTINGS_SITEURL: "{{ .inputs.site_url }}"
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://{{ .databases.db.user }}:{{ .databases.db.password }}@{{ .databases.db.host }}:{{ .databases.db.port }}/{{ .databases.db.name }}?sslmode=disable&connect_timeout=10"
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
    secretEnv:
      - MM_SQLSETTINGS_DATASOURCE
    mounts:
      - volume: config
        path: /mattermost/config
      - volume: data
        path: /mattermost/data
      - volume: logs
        path: /mattermost/logs
      - volume: plugins
        path: /mattermost/plugins
      - volume: client-plugins
        path: /mattermost/client/plugins
    # The image ships no shell, so container healthchecks (which run through
    # /bin/sh) cannot execute at all — readiness is the container being up.
    healthcheck:
      type: none
