name: Release image

# The catalog bundle (export.json) is released by ci.yml on tag. This workflow
# publishes the optional marketplace server image (API + storefront) to Docker
# Hub and GHCR for anyone self-hosting a live registry.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: marketplace-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # The commit's own timestamp, not "now", so re-running on the same tag
          # reproduces the same binary.
          echo "BUILD_DATE=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
          case "${GITHUB_REF_NAME}" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push marketplace
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            miabi/marketplace:${{ env.VERSION }}
            ghcr.io/miabi-io/marketplace:${{ env.VERSION }}
            ${{ env.PRERELEASE == 'false' && 'miabi/marketplace:latest' || '' }}
            ${{ env.PRERELEASE == 'false' && 'ghcr.io/miabi-io/marketplace:latest' || '' }}



  deploy:
    runs-on: ubuntu-latest
    needs: image
    env:
      MIABI_SERVER: ${{ secrets.MIABI_SERVER }}
    steps:
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Deploy to Miabi
        if: env.MIABI_SERVER != ''
        uses: miabi-io/deploy-action@v1
        with:
          app: marketplace
          tag: ${{ env.VERSION }}
          server: ${{ secrets.MIABI_SERVER }}
          token: ${{ secrets.MIABI_TOKEN }}
          wait: true
          timeout: 10m
