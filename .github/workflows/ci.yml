name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2
        with:
          files: '.github/workflows/*.yml'

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Typecheck and build the storefront
        run: make build-ui

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Lint catalog (validate every template + digests + unique slugs)
        run: go run ./cmd/marketplace lint

      # On main the publish job regenerates them instead, so this is a PR-only nudge.
      - name: Generated artifacts are up to date
        if: github.event_name == 'pull_request'
        run: |
          go run ./cmd/marketplace generate
          git diff --exit-code export.json registry/index.json \
            || (echo "::error::export.json / registry/index.json are stale — run 'go run ./cmd/marketplace generate' and commit, or let the merge-to-main job regenerate them." && exit 1)

  # Regenerate the artifacts on main so contributors never have to; Miabi syncs from release assets, not main.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Generate catalog artifacts
        run: go run ./cmd/marketplace generate

      - name: Commit regenerated artifacts
        run: |
          if git diff --quiet -- export.json registry/index.json; then
            echo "No catalog changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export.json registry/index.json
          git commit -m "chore(catalog): regenerate export.json + index [skip ci]"
          git push

  # Miabi syncs from the latest release's export.json, so cutting a tag is how a new catalog goes live.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Generate catalog bundle
        run: go run ./cmd/marketplace generate

      - name: Publish release with export.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(grep -o '"slug"' export.json | wc -l | tr -d ' ')
          notes="Marketplace catalog bundle for ${GITHUB_REF_NAME} (${count} templates)."
          # The tag glob matches v1.2.3-rc.1 too; flag it so a candidate never becomes the catalog installs sync.
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" export.json registry/index.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" export.json registry/index.json ${prerelease} \
              --title "Catalog ${GITHUB_REF_NAME}" --notes "${notes}"
          fi
