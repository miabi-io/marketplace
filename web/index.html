<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Everything between the seo markers is replaced per request by
         internal/seo, which fills in the page's own title, description,
         canonical URL and structured data. A crawler that does not run the SPA
         would otherwise see this one generic head on every URL. The defaults
         below are what the Vite dev server and any direct file read get.
         Removing either marker turns per-page tags off — internal/seo has a
         test that fails if the built shell loses them. -->
    <!-- seo:start -->
    <title>Miabi Marketplace — official &amp; community app templates</title>
    <meta
      name="description"
      content="Browse official and community Miabi templates: one-click apps, databases and stacks for the open-source PaaS for Docker."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://marketplace.miabi.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miabi Marketplace" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://marketplace.miabi.io/" />
    <meta property="og:title" content="Miabi Marketplace — official &amp; community app templates" />
    <meta
      property="og:description"
      content="Official and community app templates for Miabi — the open-source PaaS for Docker."
    />
    <meta property="og:image" content="https://marketplace.miabi.io/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Miabi Marketplace — official &amp; community app templates" />
    <meta
      name="twitter:description"
      content="Official and community app templates for Miabi — the open-source PaaS for Docker."
    />
    <meta name="twitter:image" content="https://marketplace.miabi.io/og-image.png" />
    <!-- seo:end -->
    <!-- Paint the shell in the stored theme before Vue mounts, so a dark-mode
         reload never flashes white. -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('miabi_theme')
          const dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          /* private mode: fall through to the light default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
